syntax = "proto3";

package engine.v1;

option go_package = "github.com/Usefused/cli/internal/enginegrpc;enginegrpc";

// This is the CLI's deliberately small client projection of the canonical
// Engine SDK transport. Field numbers and RPC paths must stay byte-compatible
// with engine-release/proto/engine/v1/engine.proto.
service EngineService {
  rpc Connect(ConnectRequest) returns (ConnectResponse);
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);
  rpc Execute(ExecuteRequest) returns (stream ExecuteResponse);
}

message ConnectRequest {
  string app_id = 1;
  string token = 2;
}

message ConnectResponse {}

message DisconnectRequest {
  string app_id = 1;
}

message DisconnectResponse {}

message ExecuteRequest {
  string app_id = 1;
  string token = 2;
  string endpoint_name = 3;
  bytes params = 4;
  map<string, string> credentials = 5;
  string environment = 6;
  string idempotency_key = 7;
  string request_body_hash = 8;
  reserved 9;
  reserved "retry_override";
}

message ExecuteResponse {
  bytes result = 1;
  string error = 2;
  int32 status_code = 3;
}
