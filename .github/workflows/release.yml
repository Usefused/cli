name: Release CLI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

# Serial release mutation prevents two main-branch pushes from calculating the same next tag concurrently.
concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test release tag calculation
        run: ./scripts/next-release-tag_test.sh

      - name: Bump version and push tag
        if: github.ref == 'refs/heads/main'
        id: tag
        run: |
          # Refresh tags after queued releases so calculation sees every remote release identity.
          git fetch --force --tags origin
          TAG_OUTPUT=$(./scripts/next-release-tag.sh)
          echo "$TAG_OUTPUT" >> "$GITHUB_OUTPUT"
          LATEST_TAG=$(sed -n 's/^latest_tag=//p' <<< "$TAG_OUTPUT")
          NEW_TAG=$(sed -n 's/^new_tag=//p' <<< "$TAG_OUTPUT")
          BUMP=$(sed -n 's/^bump=//p' <<< "$TAG_OUTPUT")
          ALREADY_TAGGED=$(sed -n 's/^already_tagged=//p' <<< "$TAG_OUTPUT")
          if [ "$ALREADY_TAGGED" = "true" ]; then
            echo "HEAD already tagged $NEW_TAG, skipping bump"
            exit 0
          fi
          echo "Bump: $BUMP (0=patch, 1=minor, 2=major) | $LATEST_TAG → $NEW_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Stage versioned skills
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.new_tag || github.ref_name }}
        run: ./scripts/stage-release-skills.sh "$RELEASE_VERSION"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean -f .goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
