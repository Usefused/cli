name: Release CLI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

# Serial release mutation prevents two main-branch pushes from calculating the same next tag concurrently.
concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # The selected compiler is installed explicitly, so Go must never download a second toolchain into the module cache.
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test release tag calculation
        run: ./scripts/next-release-tag_test.sh

      - name: Test Go toolchain resolution
        run: ./scripts/go-toolchain-version_test.sh

      - name: Resolve Go toolchain
        id: go-toolchain
        run: echo "version=$(./scripts/go-toolchain-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-toolchain.outputs.version }}
          # setup-go cannot exclude downloaded toolchains from its module cache, so release restores must remain disabled.
          cache: false

      - name: Verify Go toolchain
        env:
          EXPECTED_GO_VERSION: ${{ steps.go-toolchain.outputs.version }}
        run: |
          ACTUAL_GO_VERSION=$(go env GOVERSION)
          # Fail before publishing a tag if the runner did not install the exact compiler declared by go.mod.
          if [ "$ACTUAL_GO_VERSION" != "go$EXPECTED_GO_VERSION" ]; then
            echo "::error::expected Go $EXPECTED_GO_VERSION, got $ACTUAL_GO_VERSION"
            exit 1
          fi

      - name: Test CLI
        run: go test ./...

      - name: Bump version and push tag
        if: github.ref == 'refs/heads/main'
        id: tag
        run: |
          # Refresh tags after queued releases so calculation sees every remote release identity.
          git fetch --force --tags origin
          TAG_OUTPUT=$(./scripts/next-release-tag.sh)
          echo "$TAG_OUTPUT" >> "$GITHUB_OUTPUT"
          LATEST_TAG=$(sed -n 's/^latest_tag=//p' <<< "$TAG_OUTPUT")
          NEW_TAG=$(sed -n 's/^new_tag=//p' <<< "$TAG_OUTPUT")
          BUMP=$(sed -n 's/^bump=//p' <<< "$TAG_OUTPUT")
          ALREADY_TAGGED=$(sed -n 's/^already_tagged=//p' <<< "$TAG_OUTPUT")
          if [ "$ALREADY_TAGGED" = "true" ]; then
            echo "HEAD already tagged $NEW_TAG, skipping bump"
            exit 0
          fi
          echo "Bump: $BUMP (0=patch, 1=minor, 2=major) | $LATEST_TAG → $NEW_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Stage versioned skills
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.new_tag || github.ref_name }}
        run: ./scripts/stage-release-skills.sh "$RELEASE_VERSION"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean -f .goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
